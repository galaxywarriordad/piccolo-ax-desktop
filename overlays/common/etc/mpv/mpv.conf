# piccolo-ax-desktop fullscreen YouTube / media playback config

# Fullscreen-only launch
fs=yes
keep-open=yes

# Hardware video decode first, safe software/SIMD fallback
hwdec=auto-safe
vo=gpu-next
gpu-api=opengl

# Audio: pull best audio stream via yt-dlp without heavy post-processing
ytdl=yes
ytdl-format=bestvideo[height<=1080][fps<=60]+bestaudio/bestvideo[height<=1080]+bestaudio/best
audio-channels=stereo
volume-max=150
